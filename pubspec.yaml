name: allerscan
description: "Aplikasi pendeteksi alergen pada makanan kemasan offline berbasis OCR dan klasifikasi klinis risiko (Tinggi, Sedang, Aman)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  share_plus: ^9.0.0
  intl: ^0.19.0
  supabase_flutter: ^2.16.0
  google_sign_in: ^6.2.2
  permission_handler: ^11.4.0
  camera: ^0.12.0+2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon_full.png"
  adaptive_icon_background: "#006A43"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#006A43"
  image: "assets/branding/icon_foreground.png"
  android: true
  ios: false
  android_12:
    image: "assets/branding/icon_foreground.png"
    color: "#006A43"
    icon_background_color: "#006A43"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
