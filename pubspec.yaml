name: allerscan
description: "Aplikasi pendeteksi alergen pada makanan kemasan offline berbasis OCR dan klasifikasi klinis risiko (Tinggi, Sedang, Aman)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  share_plus: ^9.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/allergens.json
