<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "outline-variant": "#bdcabf", "tertiary-container": "#a36700", "surface-container-highest": "#dce2f7", "inverse-surface": "#293040", "background": "#f9f9ff", "primary": "#006a43", "on-secondary-container": "#fffbff", "surface-container-low": "#f1f3ff", "on-secondary-fixed": "#410004", "on-primary": "#ffffff", "surface-bright": "#f9f9ff", "error": "#ba1a1a", "tertiary": "#825100", "on-error": "#ffffff", "surface-tint": "#006c44", "primary-fixed-dim": "#71dba2", "secondary-container": "#da3437", "secondary": "#b61722", "on-error-container": "#93000a", "surface-container": "#e9edff", "on-secondary": "#ffffff", "on-tertiary-fixed-variant": "#653e00", "primary-fixed": "#8df8bd", "on-tertiary-container": "#fffbff", "on-tertiary-fixed": "#2a1700", "secondary-fixed-dim": "#ffb3ad", "outline": "#6e7a71", "on-tertiary": "#ffffff", "on-surface": "#141b2b", "on-primary-container": "#f6fff6", "tertiary-fixed": "#ffddb8", "error-container": "#ffdad6", "surface-container-lowest": "#ffffff", "primary-container": "#008655", "on-surface-variant": "#3e4941", "inverse-on-surface": "#edf0ff", "surface": "#f9f9ff", "surface-variant": "#dce2f7", "secondary-fixed": "#ffdad7", "tertiary-fixed-dim": "#ffb95f", "on-background": "#141b2b", "on-secondary-fixed-variant": "#930013", "surface-container-high": "#e1e8fd", "on-primary-fixed-variant": "#005232", "inverse-primary": "#71dba2", "on-primary-fixed": "#002112", "surface-dim": "#d3daef" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "margin": "1.25rem", "space-md": "1rem", "space-xl": "2rem", "gutter": "1rem" }, fontFamily: { "headline-sm": ["Inter"], "body-lg": ["Inter"], "caption": ["Inter"], "label-sm": ["Inter"], "body-md-medium": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "label-md": ["Inter"] }, fontSize: { "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-md-medium": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#f9f9ff;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-space-sm flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Kembali" class="w-11 h-11 flex items-center justify-center text-on-surface rounded-full hover:bg-surface-container-high transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex items-center gap-space-xs"><img alt="AllerScan Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UQIF7Z4Ibm8uF0_oyDSNAXsuqNGRq0P2hmVGl8tKnYoF4il3l-LdJ_s_MFmOLvEcwpfPeAqoutWX9O5kVFmlZdUYkf-puwoAofIGCmvRV-L7aUZenxg_A9t9-3khjlVkZdVY2p_IjZCb9b60osM4z-COnZe0Yx8ar0CjBDQqtLQaFM10zQLfXPXkLZCaAp_4gWIWi662lhkgfog_jotwTCixnF8HeNAEYtMuPDvIJMARLcFv-yDvJlmUk"/><h1 class="text-headline-sm font-headline-sm text-on-surface tracking-tight truncate max-w-[200px]">Hasil Deteksi Alergen</h1></div></div><div class="flex items-center pr-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-8">
<div class="px-5 pt-3 flex flex-col gap-4">
<!-- Active Allergen Reminder Pill -->
<div class="flex items-center gap-2.5 bg-surface-container px-3.5 py-2.5 rounded-full shadow-sm">
<div class="w-6 h-6 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<div class="flex flex-col min-w-0">
<span class="text-caption font-caption text-on-surface-variant leading-none">Memeriksa terhadap:</span>
<span class="text-label-sm font-label-sm text-on-surface truncate mt-0.5">Kacang, Susu, Gluten, Udang</span>
</div>
<button aria-label="Ubah profil alergen" class="ml-auto text-primary text-caption font-caption font-semibold shrink-0" type="button">
        Ubah
      </button>
</div>
<!-- Main Text Input Card -->
<div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm flex flex-col gap-3">
<div class="flex items-center justify-between">
<label class="text-label-md font-label-md text-on-surface flex items-center gap-1.5" for="ingredients-input">
<span class="material-symbols-outlined text-[18px] text-primary">format_list_bulleted</span>
          Daftar Bahan / Komposisi
        </label>
<button class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-surface-container-low text-primary active:scale-95 transition-transform" id="paste-btn" type="button">
<span class="material-symbols-outlined text-[16px]">content_paste</span>
<span class="text-caption font-caption font-medium">Tempel</span>
</button>
</div>
<div class="relative">
<textarea class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-md font-body-md p-0 border-0 focus:outline-none focus:ring-0 resize-none leading-relaxed" id="ingredients-input" maxlength="2000" placeholder="Ketik atau tempel daftar komposisi di sini...

Contoh: Tepung terigu, gula, minyak nabati, susu bubuk skim (2%), pasta kacang tanah (1.5%), pengemulsi lesitin kedelai..." rows="7"></textarea>
</div>
<!-- Action Footer within Card -->
<div class="pt-2 flex items-center justify-between text-caption font-caption text-outline">
<button aria-label="Hapus semua teks" class="text-outline hover:text-error transition-colors flex items-center gap-1 opacity-0 pointer-events-none" id="clear-btn" type="button">
<span class="material-symbols-outlined text-[14px]">delete</span>
<span>Bersihkan</span>
</button>
<div class="font-medium" id="char-count">0 / 2000 karakter</div>
</div>
</div>
<!-- Quick Insert Helper Chips -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<span class="text-caption font-caption font-semibold text-on-surface-variant tracking-wider uppercase">Sisipkan Cepat</span>
<span class="text-caption font-caption text-outline">Tekan untuk menambahkan</span>
</div>
<div class="flex flex-wrap gap-2">
<button class="quick-chip inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-lowest text-on-surface text-label-sm font-label-sm shadow-sm active:bg-surface-container transition-colors" data-ingredient="Tepung terigu" type="button">
<span class="material-symbols-outlined text-[14px] text-primary">add</span>
          Tepung terigu
        </button>
<button class="quick-chip inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-lowest text-on-surface text-label-sm font-label-sm shadow-sm active:bg-surface-container transition-colors" data-ingredient="Susu bubuk skim" type="button">
<span class="material-symbols-outlined text-[14px] text-primary">add</span>
          Susu bubuk
        </button>
<button class="quick-chip inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-lowest text-on-surface text-label-sm font-label-sm shadow-sm active:bg-surface-container transition-colors" data-ingredient="Lesitin kedelai" type="button">
<span class="material-symbols-outlined text-[14px] text-primary">add</span>
          Kedelai
        </button>
<button class="quick-chip inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-lowest text-on-surface text-label-sm font-label-sm shadow-sm active:bg-surface-container transition-colors" data-ingredient="Putih telur" type="button">
<span class="material-symbols-outlined text-[14px] text-primary">add</span>
          Telur
        </button>
<button class="quick-chip inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-lowest text-on-surface text-label-sm font-label-sm shadow-sm active:bg-surface-container transition-colors" data-ingredient="Kacang almond panggang" type="button">
<span class="material-symbols-outlined text-[14px] text-primary">add</span>
          Almond
        </button>
</div>
</div>
<!-- Safety Tip Card -->
<div class="bg-surface-container-low rounded-xl p-3.5 flex items-start gap-3">
<span class="material-symbols-outlined text-[20px] text-primary shrink-0 mt-0.5">info</span>
<p class="text-caption font-caption text-on-surface-variant leading-relaxed">
        Pastikan ejaan sesuai dengan label kemasan. Sistem kami mengenali nama ilmiah serta turunan alergen umum secara otomatis.
      </p>
</div>
<!-- Primary CTA Button -->
<div class="pt-2">
<button class="w-full h-12 bg-primary text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center gap-2 shadow-sm active:bg-primary-container transition-all disabled:opacity-50 disabled:pointer-events-none" id="analyze-btn" type="button">
<span class="material-symbols-outlined text-[20px]">search_check</span>
<span>Analisis Komposisi</span>
</button>
</div>
</div>
<script>
    (function() {
      const textarea = document.getElementById('ingredients-input');
      const charCount = document.getElementById('char-count');
      const clearBtn = document.getElementById('clear-btn');
      const pasteBtn = document.getElementById('paste-btn');
      const analyzeBtn = document.getElementById('analyze-btn');
      const chips = document.querySelectorAll('.quick-chip');

      function updateState() {
        const len = textarea.value.length;
        charCount.textContent = len + ' / 2000 karakter';
        if (len > 0) {
          clearBtn.classList.remove('opacity-0', 'pointer-events-none');
          analyzeBtn.disabled = false;
        } else {
          clearBtn.classList.add('opacity-0', 'pointer-events-none');
        }
      }

      textarea.addEventListener('input', updateState);

      clearBtn.addEventListener('click', function() {
        textarea.value = '';
        updateState();
        textarea.focus();
      });

      pasteBtn.addEventListener('click', async function() {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const clipText = await navigator.clipboard.readText();
            if (clipText) {
              if (textarea.value.trim().length > 0) {
                textarea.value += ', ' + clipText.trim();
              } else {
                textarea.value = clipText.trim();
              }
              updateState();
              return;
            }
          }
        } catch (e) {
          // Fallback simulation if clipboard permission denied
        }
        const sampleText = 'Tepung terigu, gula pasir, minyak kelapa sawit, susu bubuk skim (3%), pasta kacang tanah (2%), pengemulsi nabati lesitin kedelai, perisa artifisial vanila.';
        textarea.value = sampleText;
        updateState();
      });

      chips.forEach(chip => {
        chip.addEventListener('click', function() {
          const item = this.getAttribute('data-ingredient');
          const current = textarea.value.trim();
          if (current.length === 0) {
            textarea.value = item;
          } else if (current.endsWith(',')) {
            textarea.value = current + ' ' + item;
          } else {
            textarea.value = current + ', ' + item;
          }
          updateState();
          textarea.focus();
        });
      });

      analyzeBtn.addEventListener('click', function() {
        if (!textarea.value.trim()) {
          textarea.focus();
          return;
        }
        analyzeBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Menganalisis...</span>';
        setTimeout(() => {
          analyzeBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span><span>Selesai!</span>';
        }, 800);
      });
    })();
  </script>
</div></main></body></html>
