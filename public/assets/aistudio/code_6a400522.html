</button>
<div class="flex flex-col items-center">
<span class="font-headline-sm text-headline-sm text-on-primary tracking-wide drop-shadow-sm">Pindai Komposisi</span>
<div class="flex items-center gap-1 mt-0.5">

</button>

<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin my-2">
<div class="relative w-full max-w-[320px] aspect-[4/5] rounded-xl flex items-center justify-center overflow-hidden" id="viewfinder">
<div class="absolute inset-0 bg-primary/5 pointer-events-none backdrop-brightness-110"></div>

<path d="M 12 40 L 12 18 A 8 8 0 0 1 20 10 L 42 10" stroke="#FFFFFF" stroke-linecap="round" stroke-width="3.5"></path>

<path d="M 278 390 L 300 390 A 8 8 0 0 0 308 382 L 308 360" stroke="#FFFFFF" stroke-linecap="round" stroke-width="3.5"></path>

</div>
<div class="absolute bottom-3 left-4 right-4 flex items-center justify-between text-caption font-caption text-surface/70 px-1 pointer-events-none">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">auto_awesome</span>
            Deteksi Cepat

</div>
</div>
<div class="mt-4 flex items-center gap-2 px-3 py-1 bg-surface-container-highest/20 backdrop-blur-sm rounded-full">
<span class="material-symbols-outlined text-body-md text-primary-fixed">center_focus_strong</span>
<span class="font-caption text-caption text-surface-bright">Posisikan teks komposisi di dalam kotak</span>
</div>
</div>
<div class="relative z-20 w-full px-margin pb-8 pt-4 bg-gradient-to-t from-inverse-surface via-inverse-surface/80 to-transparent flex flex-col items-center">
<div class="w-full flex items-center justify-around max-w-[340px]">
<button class="flex flex-col items-center gap-1.5 text-on-primary group focus:outline-none" id="btn-gallery" type="button">
<div class="w-13 h-13 p-3 rounded-full bg-inverse-surface/80 backdrop-blur-md text-surface flex items-center justify-center group-active:scale-90 transition-all shadow-sm">
<span class="material-symbols-outlined text-body-lg text-surface-bright">photo_library</span>
</div>
<span class="font-label-sm text-label-sm text-surface-container-highest tracking-wide">Galeri</span>
</button>
<div class="relative flex items-center justify-center">
<div class="absolute w-20 h-20 rounded-full bg-primary/30 scale-100 transition-transform duration-300 pointer-events-none" id="shutter-pulse"></div>
<button aria-label="Pindai Sekarang" class="relative w-18 h-18 rounded-full bg-surface-container-lowest p-1 flex items-center justify-center active:scale-95 transition-transform duration-150 shadow-xl focus:outline-none" id="shutter-button" type="button">
<div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center active:bg-primary-container transition-colors shadow-inner">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
</button>
</div>
<button class="flex flex-col items-center gap-1.5 text-on-primary group focus:outline-none" id="btn-manual" type="button">
<div class="w-13 h-13 p-3 rounded-full bg-inverse-surface/80 backdrop-blur-md text-surface flex items-center justify-center group-active:scale-90 transition-all shadow-sm">
<span class="material-symbols-outlined text-body-lg text-surface-bright">keyboard</span>
</div>
<span class="font-label-sm text-label-sm text-surface-container-highest tracking-wide">Manual</span>
</button>

          Gluten
        </span>
<span class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary-fixed"></span>
          Kacang
        </span>
<span class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary-fixed"></span>
          Susu & Kedelai
        </span>
</div>
</div>
<div class="absolute top-20 left-1/2 transform -translate-x-1/2 z-30 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 px-4 py-2 bg-inverse-surface/90 backdrop-blur-md rounded-full shadow-lg" id="feedback-toast">
<span class="material-symbols-outlined text-primary-fixed text-body-md" id="toast-icon">check_circle</span>
<span class="font-label-sm text-label-sm text-on-primary" id="toast-msg">Menganalisis teks...</span>
</div>
</div>
</div>
<script>
  (function () {
    const laser = document.getElementById('scan-laser');
    const shutter = document.getElementById('shutter-button');
    const shutterPulse = document.getElementById('shutter-pulse');
    const torchBtn = document.getElementById('btn-torch');
    const flashIcon = document.getElementById('flash-icon');
    const toast = document.getElementById('feedback-toast');
    const toastMsg = document.getElementById('toast-msg');
    const toastIcon = document.getElementById('toast-icon');

    let laserPos = 0;
    let laserDir = 1.8;
    let animId = null;
    let flashOn = false;

    function animateLaser() {
      if (!laser) return;
      laserPos += laserDir;
      if (laserPos > 370) {
        laserDir = -1.8;
      } else if (laserPos < 10) {
        laserDir = 1.8;
      }
      laser.style.transform = 'translateY(' + laserPos + 'px)';
      animId = requestAnimationFrame(animateLaser);
    }
    animId = requestAnimationFrame(animateLaser);

    function showNotification(msg, iconName) {
      if (!toast) return;
      toastMsg.textContent = msg;
      toastIcon.textContent = iconName || 'info';
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2200);
    }

    if (torchBtn && flashIcon) {
      torchBtn.addEventListener('click', function () {
        flashOn = !flashOn;
        if (flashOn) {
          flashIcon.textContent = 'flash_on';
          torchBtn.classList.add('bg-primary', 'text-on-primary');
          torchBtn.classList.remove('bg-inverse-surface/60');
          showNotification('Lampu kilat aktif', 'flash_on');
        } else {
          flashIcon.textContent = 'flash_off';
          torchBtn.classList.remove('bg-primary', 'text-on-primary');
          torchBtn.classList.add('bg-inverse-surface/60');
          showNotification('Lampu kilat mati', 'flash_off');
        }
      });
    }

    if (shutter) {
      shutter.addEventListener('click', function () {
        if (shutterPulse) {
          shutterPulse.classList.add('scale-150', 'opacity-0');
          setTimeout(() => {
            shutterPulse.classList.remove('scale-150', 'opacity-0');
          }, 350);
        }
        showNotification('Memindai komposisi produk...', 'document_scanner');
      });
    }

    const galleryBtn = document.getElementById('btn-gallery');
    if (galleryBtn) {
      galleryBtn.addEventListener('click', function () {
        showNotification('Membuka galeri foto...', 'photo_library');
      });
    }

    const manualBtn = document.getElementById('btn-manual');
    if (manualBtn) {
      manualBtn.addEventListener('click', function () {
        showNotification('Beralih ke mode ketik manual', 'keyboard');
      });
    }

    const backBtn = document.getElementById('btn-back');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        showNotification('Menutup pemindai...', 'arrow_back');
      });
    }
  })();
</script></main></body></html>
